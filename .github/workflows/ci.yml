name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++-14 make liblua5.4-dev python3

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build --parallel

      - name: Run CLI regression tests
        run: python3 tests/test_cli.py build/edut

  windows-build-and-test:
    runs-on: windows-latest
    env:
      VCPKG_DOWNLOADS: ${{ github.workspace }}\vcpkg-downloads

    steps:
      - uses: actions/checkout@v6

      - name: Prepare vcpkg downloads directory
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-downloads-windows-lua-5.5.1-v1
          restore-keys: vcpkg-downloads-windows-

      - name: Install Lua
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            vcpkg install lua:x64-windows
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt 3) {
              Write-Host "vcpkg failed; retrying in $($attempt * 10) seconds..."
              Start-Sleep -Seconds ($attempt * 10)
            }
          }

          exit $LASTEXITCODE

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run CLI regression tests
        run: python tests/test_cli.py build/Release/edut.exe
